#启用虚拟线程模式
spring.threads.virtual.enabled=true
#在非web服务场景下保证使用虚拟线程模式时，程序不会因为没有非守护线程而停止，web服务不需要
spring.main.keep-alive=false
#关闭资源前的等待时间统一
dc.shutdown.await-termination-period=60s
#关闭reactorNetty资源之前要等待的时间
spring.reactor.netty.shutdown-quiet-period=${dc.shutdown.await-termination-period}
#关闭生命周期任何阶段的超时时间
spring.lifecycle.timeout-per-shutdown-phase=${dc.shutdown.await-termination-period}

#定时任务执行器
#是否开启定时任务优化，相同任务上次未执行完，下次任务不执行，避免任务周期过短且任务执行时间过长导致的任务重复执行，集群环境下可自动由另一台服务器接替执行。不同任务互不影响。未开启则参考spring默认配置
dc.task.scheduling.optimize=true
#执行器是否应等待计划任务在关机时完成
spring.task.scheduling.shutdown.await-termination=true
#执行者应等待剩余任务完成的最长时间
spring.task.scheduling.shutdown.await-termination-period=${dc.shutdown.await-termination-period}

#异步任务执行器
#执行器是否应等待计划任务在关机时完成
spring.task.execution.shutdown.await-termination=true
#执行者应等待剩余任务完成的最长时间
spring.task.execution.shutdown.await-termination-period=${dc.shutdown.await-termination-period}


#优雅关机，保证服务正常停止
server.shutdown=graceful

#允许循环依赖，解决循环依赖错误，默认false：不允许
spring.main.allow-circular-references=false
#是否检查模板位置是否存在
spring.freemarker.check-template-location=false

#默认时间格式
dc.format.date-time=yyyy-MM-dd HH:mm:ss
spring.mvc.format.date-time=${dc.format.date-time}

#是否设置servlet响应编码，默认设置为UTF-8（servlet默认编码是iso8859-1，可能导致中文乱码）
server.servlet.encoding.force-response=true

#web容器启动时立即初始化DispatcherServlet，避免首次http请求因初始化导致响应速度较慢的问题
spring.mvc.servlet.load-on-startup=0
#禁用一些非标准或不常用的过滤器
spring.mvc.formcontent.filter.enabled=false
spring.mvc.hiddenmethod.filter.enabled=false
#请求结束时是否发布ServletRequestHandledEvent事件，不常用，禁用
spring.mvc.publish-request-handled-events=false
#禁用服务器错误时显示在浏览器中的错误页面（前后端分离场景中不适用），有bug，暂时不能关闭，关闭可能导致视图循环错误，详见：https://github.com/spring-projects/spring-boot/issues/2001
#server.error.whitelabel.enabled=false
#禁用reactor netty的调试代理
spring.reactor.debug-agent.enabled=false

#数据源
#获取连接超时时间，30秒
spring.datasource.hikari.connection-timeout=30000
#连接处于空闲时检测连接是否存活的时间间隔，60秒
spring.datasource.hikari.keepalive-time=60000
#连接池的连接数，设置太低会存在连接数耗尽的风险，尽管可能存在连接数浪费，但利大于弊，不推荐修改
spring.datasource.hikari.maximum-pool-size=100
#连接池中的最小空闲连接数（包括空闲连接和正在使用的连接）
spring.datasource.hikari.minimum-idle=10
#事务隔离级别，RC(读已提交)
spring.datasource.hikari.transaction-isolation=TRANSACTION_READ_COMMITTED
#数据库连接懒获取模式（尽可能晚地获取 JDBC 连接，如果没有任何语句被执行的话，则完全不获取连接），可以显著优化连接池争用问题并可能减少不必要的连接获取以提高性能
spring.datasource.connection-fetch=lazy

#jpa配置
#关闭视图层事务session保持，不允许开启
spring.jpa.open-in-view=false
#事务完成后释放连接（提升性能）
spring.jpa.properties.hibernate.connection.handling_mode=DELAYED_ACQUISITION_AND_RELEASE_AFTER_TRANSACTION
#允许事务外更新（提升性能），主要应用于单条更新语句
spring.jpa.properties.hibernate.allow_update_outside_transaction=true
#支持批量操作sql的数量
spring.jpa.properties.hibernate.jdbc.batch_size=50
#批量操作时是否应用乐观锁
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true
#按主键值排序新增，提升批量插入性能
spring.jpa.properties.hibernate.order_inserts=true
#按主键值排序修改，提升批量修改性能，降低事务死锁概率
spring.jpa.properties.hibernate.order_updates=true
#需要更多行时应从数据库中读取的行数
spring.jpa.properties.hibernate.jdbc.fetch_size=100
#使用jdbc读写java.time包下的时间类，依赖较新的jdbc驱动，hibernate出于兼容性考虑，默认不启用，这里启用
spring.jpa.properties.hibernate.type.java_time_use_direct_jdbc=true
#是否完全禁用JPA回调（在不使用时节省内存，可能会在内存开销解决后立即移除该选项），详见：https://docs.hibernate.org/orm/6.6/userguide/html_single/#settings
#spring.jpa.properties.hibernate.jpa_callbacks.enabled=false
#是否应该处理XML映射，当映射细节仅通过注解定义时（不推荐也不需要使用xml），这是一种性能优化
#spring.jpa.properties.hibernate.xml_mapping_enabled=false
#启用时，指定在启动时检查命名查询。主要用于测试环境
#spring.jpa.properties.hibernate.query.startup_check=false

#日志分组
#显示sql，参数绑定
#logging.group.jpa-sql=org.hibernate.SQL,org.hibernate.orm.jdbc.bind
#事务日志
#logging.group.jpa-sql-transaction=org.hibernate.engine.transaction.internal
#绑定返回结果
#logging.group.jpa-sql-result=org.hibernate.orm.results
#其他日志，包含连接和各种资源的释放
#logging.group.jpa-sql-other=org.hibernate.resource.jdbc.internal.LogicalConnectionManagedImpl,org.springframework.orm.jpa.JpaTransactionManager,org.hibernate.resource.jdbc.internal.ResourceRegistryStandardImpl
#logging.group.jdbc-sql=org.springframework.jdbc.core.JdbcTemplate,org.springframework.jdbc.core.StatementCreatorUtils,org.springframework.jdbc.core.BeanPropertyRowMapper
#logging.group.querydsl.sql=com.querydsl.sql.AbstractSQLQuery

#当需要更多行时，应从数据库获取的行数
spring.jdbc.template.fetch-size=100

#redis配置
#是否启用存储库形式操作redis，不启用，不推荐使用，推荐使用RedisTemplate操作更加灵活全面且容易理解
spring.data.redis.repositories.enabled=false
#获取连接超时时间，30秒
spring.data.redis.connect-timeout=30s

#mongodb配置（连接池配置默认最小：0，最大：100，无需更改）
#是否启用存储库形式操作mongodb，不启用，不推荐使用，推荐使用MongoTemplate操作更加灵活全面且容易理解
spring.data.mongodb.repositories.type=none

#静态资源配置
spring.web.resources.static-locations=file:./static/,classpath:/static/
#已在DcWebAutoConfiguration中使用了性能更好的方式注册，不需要默认的注册
spring.web.resources.add-mappings=false
#开启静态资源响应缓存，强烈推荐开启。开发环境可以在开发者工具中禁用缓存（Disable Cache或Ctrl+F5强制刷新缓存）以避免因缓存导致的代码修改不生效
spring.web.resources.cache.cachecontrol.max-age=365d

#tomcat配置
#连接器能接受的最大连接数（默认8192），包含WebSocket长连接，按实际并发规模调整
server.tomcat.max-connections=51200
#慢速攻击防御
#建立连接后等待请求行与请求头、以及读取请求体时两次数据包间隔的最大时间（默认60秒），超时即断开，恶意慢速连接会在10秒内被清理
server.tomcat.connection-timeout=10s
#请求体未读完就结束请求时（如客户端中断上传），Tomcat为复用连接最多吞掉的剩余请求体大小（默认2MB），超过则直接关闭连接；调小可加速此类连接回收，压缩慢速攻击占用连接的时间窗口
server.tomcat.max-swallow-size=100KB
